<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><title>日文單字卡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans JP",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 60px}h1{font-size:27px;margin:5px 0}.sub{color:#777}.tabs,.row,.level{display:flex;gap:8px;margin:10px 0}.tab,.row button,.level button,.wide{flex:1;border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:700}.tab{background:#e6e6eb}.active,.dark{background:#111;color:#fff}.light{background:#e7e7ec}.ai{background:#eee9ff;color:#4d2e9b}.panel,.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 7px 26px #0001;margin-bottom:14px}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #d8d8dc;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:70px}.wide{width:100%;margin-top:12px}.card{min-height:400px;display:flex;flex-direction:column;justify-content:center;text-align:center}.jp{font-size:44px;font-weight:800}.reading{font-size:19px;color:#777;margin:6px 0 20px}.meaning{font-size:25px;font-weight:700;margin-bottom:20px}.ex{border-top:1px solid #eee;padding-top:16px;text-align:left}.ej{font-size:19px;line-height:1.6}.ec{color:#666}.hint{color:#999}.hidden{display:none}.count,.msg,.small{color:#777;font-size:14px}.item{padding:12px 0;border-bottom:1px solid #eee;line-height:1.5}.item b{font-size:18px}.delete{float:right;border:0;border-radius:9px;padding:7px 10px;background:#ffe0e0}.note{background:#faf7ff;padding:11px;border-radius:11px;color:#5d4a7a;font-size:14px;line-height:1.5;margin-top:10px}
</style></head><body><div class="app">
<h1>日文單字卡 🇯🇵</h1><p class="sub">輸入單字 → 完成資料 → 翻牌複習</p>
<div class="tabs"><button id="studyTab" class="tab active" onclick="showTab('study')">📖 背單字</button><button id="addTab" class="tab" onclick="showTab('add')">➕ 新增</button></div>
<section id="study"><div class="count" id="count"></div><div class="card" onclick="flip()"><div class="jp" id="jp"></div><div class="reading" id="reading"></div><div id="answer" class="hidden"><div class="meaning" id="meaning"></div><div class="ex"><div class="ej" id="ej"></div><div class="ec" id="ec"></div></div></div><div class="hint" id="hint">👆 點一下翻牌看答案</div></div>
<div class="row"><button class="light" onclick="prev()">← 上一個</button><button class="dark" onclick="next()">下一個 →</button></div>
<div class="row"><button class="light" onclick="shuffle()">🔀 隨機</button><button class="light" onclick="speakReading()">🔊 念讀音</button></div>
<div class="level"><button style="background:#ffe2e2" onclick="rate('不熟')">😵 不熟</button><button style="background:#fff0cf" onclick="rate('普通')">😐 普通</button><button style="background:#e0f5e7" onclick="rate('熟悉')">😊 熟悉</button></div></section>
<section id="add" class="hidden"><div class="panel"><label>日文單字 *</label><input id="jpInput" placeholder="例如：勉強"><button class="ai wide" onclick="autoComplete()">✨ 自動完成資料</button>
<div class="note">目前內建常見單字可自動完成。真正的 AI 產生功能需要另外接安全的 AI 後端，不能把 API 金鑰直接放在網頁裡。</div>
<label>讀音／假名 *</label><input id="rInput" placeholder="例如：べんきょう"><label>中文意思 *</label><input id="mInput" placeholder="例如：學習、讀書"><label>日文例句</label><textarea id="ejInput"></textarea><label>中文例句</label><textarea id="ecInput"></textarea>
<button class="dark wide" onclick="addWord()">＋ 加入單字卡</button><div class="msg" id="msg"></div></div><div class="panel"><b>📚 我的單字</b><div id="list"></div></div></section>
</div>
<script>
const defaults=[["勉強","べんきょう","學習、讀書","毎日、日本語を勉強しています。","我每天都在學日文。"],["大切","たいせつ","重要、珍貴","家族との時間は大切です。","和家人相處的時間很重要。"],["楽しい","たのしい","快樂、有趣","日本語の勉強は楽しいです。","學日文很有趣。"],["難しい","むずかしい","困難","この漢字は難しいです。","這個漢字很難。"],["簡単","かんたん","簡單","この問題は簡単です。","這個問題很簡單。"],["旅行","りょこう","旅行","来月、日本へ旅行に行きます。","下個月我要去日本旅行。"]];
let words=JSON.parse(localStorage.getItem("jpFlashcardsV2")||"null")||defaults.map(x=>({jp:x[0],r:x[1],m:x[2],ej:x[3],ec:x[4]})),index=0,flipped=false;
function save(){localStorage.setItem("jpFlashcardsV2",JSON.stringify(words))}
function render(){if(!words.length)return;let w=words[index];jp.textContent=w.jp;reading.textContent=w.r;meaning.textContent=w.m;ej.textContent=w.ej;ec.textContent=w.ec;count.textContent=`第 ${index+1} / ${words.length} 個${w.level?"｜"+w.level:""}`;answer.classList.toggle("hidden",!flipped);hint.classList.toggle("hidden",flipped)}
function flip(){flipped=!flipped;render()}function next(){index=(index+1)%words.length;flipped=false;render()}function prev(){index=(index-1+words.length)%words.length;flipped=false;render()}function shuffle(){index=Math.floor(Math.random()*words.length);flipped=false;render()}
function speakReading(){let u=new SpeechSynthesisUtterance(words[index].r);u.lang="ja-JP";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function rate(x){words[index].level=x;save();next()}
function showTab(x){study.classList.toggle("hidden",x!="study");add.classList.toggle("hidden",x!="add");studyTab.classList.toggle("active",x=="study");addTab.classList.toggle("active",x=="add");if(x=="add")renderList()}
function autoComplete(){let w=defaults.find(x=>x[0]==jpInput.value.trim());if(!w){msg.textContent="目前沒有這個單字的內建資料，請手動填寫。";return}rInput.value=w[1];mInput.value=w[2];ejInput.value=w[3];ecInput.value=w[4];msg.textContent="✨ 已完成資料！"}
function addWord(){let v=id=>document.getElementById(id).value.trim();if(!v("jpInput")||!v("rInput")||!v("mInput")){msg.textContent="請至少填寫日文、讀音和中文意思。";return}words.push({jp:v("jpInput"),r:v("rInput"),m:v("mInput"),ej:v("ejInput"),ec:v("ecInput")});index=words.length-1;flipped=false;save();render();renderList();["jpInput","rInput","mInput","ejInput","ecInput"].forEach(x=>document.getElementById(x).value="");msg.textContent="✅ 已加入單字卡！"}
function renderList(){list.innerHTML=words.map((w,n)=>`<div class="item"><button class="delete" onclick="del(${n})">刪除</button><b>${w.jp}</b> <span class="small">${w.r}</span><br><span class="small">${w.m}</span></div>`).join("")}
function del(n){if(confirm("確定刪除？")){words.splice(n,1);index=Math.min(index,Math.max(0,words.length-1));save();render();renderList()}}render();
</script></body></html>
