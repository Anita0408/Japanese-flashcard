<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日文單字庫</title>
<meta name="theme-color" content="#0d0f12">
<style>
:root{
  --bg:#0b0d10;
  --panel:#1b1e23;
  --panel2:#20242a;
  --line:#353b45;
  --line-soft:#2a2f37;
  --text:#f4f5f7;
  --muted:#aeb4bf;
  --muted2:#7f8793;
  --accent:#f4f5f7;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.045),transparent 34%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,select,input,textarea{font:inherit}
button{touch-action:manipulation}
.app{
  width:min(760px,100%);
  margin:auto;
  padding:28px 22px 42px;
}
header{
  display:flex;
  align-items:center;
  gap:16px;
  margin:8px 0 22px;
}
h1{
  font-size:34px;
  line-height:1.15;
  margin:0;
  font-weight:800;
  letter-spacing:.01em;
}
.iconbtn,.star,.edit,.reset{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#20242a,#191c21);
  color:var(--text);
  border-radius:18px;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:inset 0 1px rgba(255,255,255,.035);
}
.iconbtn{width:58px;height:58px;font-size:30px;flex:none}
.reset{width:58px;height:58px;font-size:26px;flex:none}
select{
  width:100%;
  height:56px;
  border-radius:28px;
  background:#191c21;
  border:1px solid var(--line);
  color:var(--text);
  font-size:20px;
  padding:0 18px;
  margin-bottom:18px;
  outline:none;
}
.card{
  min-height:570px;
  perspective:1200px;
  background:
    linear-gradient(145deg,#20242a,#1a1d22);
  border:1px solid #383f49;
  border-radius:36px;
  padding:84px 34px 46px;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
  box-shadow:
    0 18px 45px rgba(0,0,0,.18),
    inset 0 1px rgba(255,255,255,.025);
  cursor:pointer;
}
.card:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 28%);
}
.edit,.star{
  position:absolute;
  width:56px;
  height:56px;
  font-size:25px;
  top:22px;
  z-index:2;
}
.edit{left:22px}
.star{right:22px}
.star.on{color:#fff}
#wordArea{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:360px;
}
.jp{
  width:100%;
  font-size:clamp(42px,8vw,58px);
  font-weight:800;
  line-height:1.18;
  letter-spacing:.01em;
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.reading{
  font-size:clamp(19px,4vw,24px);
  line-height:1.35;
  color:var(--muted);
  margin-top:12px;
}
.meaning{
  font-size:clamp(19px,4vw,24px);
  line-height:1.45;
  color:#c5cad2;
  margin-top:12px;
  max-width:94%;
}
.example{
  font-size:clamp(18px,3.8vw,21px);
  line-height:1.7;
  color:#f0f2f5;
  max-width:92%;
  margin-top:22px;
  overflow-wrap:anywhere;
}
.flip-hint{
  font-size:14px;
  color:var(--muted2);
  margin-top:20px;
}
.actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}
.next{
  height:66px;
  flex:1;
  border:0;
  border-radius:33px;
  background:linear-gradient(180deg,#f5f5f6,#e9eaec);
  color:#101216;
  font-size:23px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}
.empty{
  font-size:22px;
  color:var(--muted);
}
.status{
  font-size:13px;
  color:var(--muted2);
  text-align:center;
  margin-top:10px;
  min-height:18px;
}
.drawer{
  position:fixed;
  inset:0;
  display:none;
  background:rgba(0,0,0,.66);
  z-index:10;
  backdrop-filter:blur(5px);
}
.drawer.open{display:block}
.menu{
  width:min(330px,85vw);
  height:100%;
  background:#15181c;
  padding:28px 20px;
  box-shadow:8px 0 30px #000;
}
.menu h2{margin:5px 0 30px;font-size:27px}
.item{
  width:100%;
  text-align:left;
  background:#20242a;
  color:var(--text);
  border:1px solid var(--line);
  padding:17px;
  border-radius:16px;
  margin:10px 0;
  font-size:19px;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:18px;
  backdrop-filter:blur(6px);
}
.modal.open{display:flex}
.box{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#191c21;
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
}
.box h3{margin-top:0;font-size:25px}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{
  width:100%;
  background:#0f1114;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  font-size:17px;
  outline:none;
}
.field textarea{min-height:90px}
.row{display:flex;gap:10px;margin-top:18px}
.row button{
  flex:1;
  padding:13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#272b31;
  color:var(--text);
  font-size:17px;
}
.row .primary{background:#f0f1f2;color:#101216;border:0}
.list{display:grid;gap:10px}
.wordrow{
  background:#22262c;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.wordrow small{color:var(--muted);display:block;margin-top:3px}
@media(max-width:600px){
  .app{padding:18px 16px 34px}
  header{margin:4px 0 18px}
  h1{font-size:30px}
  .iconbtn{width:54px;height:54px}
  select{height:54px;font-size:19px;margin-bottom:16px}
  .card{
    min-height:540px;
    border-radius:32px;
    padding:78px 24px 34px;
  }
  #wordArea{min-height:350px}
  .jp{font-size:clamp(38px,11vw,52px)}
  .next{height:62px;font-size:22px}
  .reset{width:56px;height:56px}
}
@media(max-width:380px){
  .card{min-height:500px}
  #wordArea{min-height:320px}
  .edit,.star{width:52px;height:52px;top:18px}
  .edit{left:18px}.star{right:18px}
}
</style>
</head>
<body>
<div class="app">
<header><button class="iconbtn" id="menuBtn">☰</button><h1>日文單字庫</h1></header>
<select id="filter"><option value="ALL">全部單字</option><option value="N1">N1</option><option value="N2">N2</option><option value="N3">N3</option><option value="N4">N4</option><option value="N5">N5</option><option value="STAR">⭐ 打星號的單字</option></select>
<div class="card" id="card">
<button class="edit" id="editBtn" title="編輯">✎</button><button class="star" id="starBtn" title="星號">☆</button>
<div id="wordArea"><div class="empty">載入中…</div></div>
</div>
<div class="actions"><button class="next" id="nextBtn">下一題</button><button class="reset" id="resetBtn" title="重置">↻</button></div>
<div class="status" id="status"></div>
</div>

<div class="drawer" id="drawer"><div class="menu">
<h2>選單</h2>
<button class="item" id="quizMenu">單字測驗</button>
<button class="item" id="dbMenu">資料庫</button>
<button class="item" id="addMenu">新增我的單字</button>
<button class="item" id="backupMenu">備份資料</button>
<button class="item" id="restoreMenu">還原備份</button>
<input id="restoreFile" type="file" accept=".json,application/json" hidden>
</div></div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
(function(){
"use strict";
const KEY="jp_vocab_user_v2";
const VIEW="jp_vocab_seen_v2";
let base=[], user=[], seen={}, current=null, currentPool=[], flipped=false;
const fallback=[
["赤","あか","紅色","これは「赤」です。","這是「紅色」。"],
["青","あお","藍色","これは「青」です。","這是「藍色」。"],
["白","しろ","白色","これは「白」です。","這是「白色」。"],
["黒","くろ","黑色","これは「黒」です。","這是「黑色」。"],
["学生","がくせい","學生","これは「学生」です。","這是「學生」。"],
["先生","せんせい","老師","これは「先生」です。","這是「老師」。"],
["学校","がっこう","學校","これは「学校」です。","這是「學校」。"],
["日本","にほん","日本","これは「日本」です。","這是「日本」。"],
["今日","きょう","今天","これは「今日」です。","這是「今天」。"],
["明日","あした","明天","これは「明日」です。","這是「明天」。"]
].map((x,i)=>({id:"fallback-"+i,jp:x[0],r:x[1],m:x[2],ej:x[3],ec:x[4],level:"N5",star:false}));

function loadStore(){
 try{user=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(user))user=[]}catch(e){user=[]}
 try{seen=JSON.parse(localStorage.getItem(VIEW)||"{}");if(!seen||typeof seen!=="object")seen={}}catch(e){seen={}}
}
function save(){localStorage.setItem(KEY,JSON.stringify(user));localStorage.setItem(VIEW,JSON.stringify(seen))}
function norm(w,i){return {id:w.id||("base-"+i),jp:String(w.jp||w.word||"").replace(/（N[1-5]）$/,"").replace(/\(N[1-5]\)$/,""),r:w.r||w.reading||"",m:w.m||w.meaning||"",ej:w.ej||w.example||"",ec:w.ec||"",level:(w.level||"N5").toUpperCase(),star:!!w.star,category:String(w.category||w.type||w.group||"").trim()}}
function mergeData(){
 const map=new Map();
 base.forEach(w=>map.set(w.jp+"|"+w.r,w));
 user.forEach(w=>map.set(w.jp+"|"+w.r,w));
 return [...map.values()];
}
function pool(){
 const f=document.getElementById("filter").value;
 return mergeData().filter(w=>{
   if(f==="ALL") return true;
   if(f==="STAR") return !!w.star;
   if(f.startsWith("LEVEL:")) return (w.level||"").toUpperCase()===f.slice(6);
   if(f.startsWith("CAT:")) return (w.category||"")===f.slice(4);
   return false;
 });
}
function refreshFilters(){
 const select=document.getElementById("filter");
 const all=mergeData();
 const levels=[...new Set(all.map(w=>(w.level||"").toUpperCase()).filter(Boolean))].sort((a,b)=>{
   const na=parseInt(a.replace(/\D/g,"")), nb=parseInt(b.replace(/\D/g,""));
   if(!Number.isNaN(na)&&!Number.isNaN(nb)) return na-nb;
   return a.localeCompare(b);
 });
 const cats=[...new Set(all.map(w=>w.category||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
 const currentValue=select.value;
 select.innerHTML='<option value="ALL">全部單字</option><option value="STAR">⭐ 打星號的單字</option>';
 const levelGroup=document.createElement("optgroup"); levelGroup.label="等級";
 levels.forEach(l=>{const o=document.createElement("option");o.value="LEVEL:"+l;o.textContent=l;levelGroup.appendChild(o)});
 select.appendChild(levelGroup);
 if(cats.length){
   const catGroup=document.createElement("optgroup"); catGroup.label="自訂分類";
   cats.forEach(c=>{const o=document.createElement("option");o.value="CAT:"+c;o.textContent=c;catGroup.appendChild(o)});
   select.appendChild(catGroup);
 }
 if([...select.options].some(o=>o.value===currentValue)) select.value=currentValue;
}
function choose(){
 flipped=false;document.getElementById("card").classList.remove("flipped");
 currentPool=pool();
 if(!currentPool.length){current=null;render();return}
 const unseen=currentPool.filter(w=>!seen[w.id]);
 const starred=currentPool.filter(w=>w.star&&!seen[w.id]);
 const candidates=starred.length?starred:(unseen.length?unseen:currentPool.filter(w=>w.star).length?currentPool.filter(w=>w.star):currentPool);
 current=candidates[Math.floor(Math.random()*candidates.length)];
 seen[current.id]=new Date().toISOString().slice(0,10); save(); render();
}
function render(){
 const area=document.getElementById("wordArea"), star=document.getElementById("starBtn"), status=document.getElementById("status"), card=document.getElementById("card");
 card.classList.toggle("flipped",flipped);
 if(!current){
   area.innerHTML='<div class="empty">沒有符合條件的單字</div>';
   star.textContent="☆";status.textContent="";return;
 }
 if(!flipped){
   area.innerHTML='<div class="jp">'+esc(current.jp)+'</div><div class="flip-hint">點一下卡片翻牌</div>';
 }else{
   area.innerHTML='<div class="jp">'+esc(current.jp)+'</div><div class="reading">'+esc(current.r)+'</div><div class="meaning">'+esc(current.m)+'</div><div class="example">'+esc(current.ej||current.ec||"")+'</div>';
 }
 star.textContent=current.star?"★":"☆"; star.classList.toggle("on",current.star);
 status.textContent=(current.level||"")+(current.category?" · "+current.category:"");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function editWord(w){
 const cats=[...new Set(mergeData().map(x=>x.category||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
 openModal(`<h3>編輯單字</h3>
 <div class="field"><label>日文</label><input id="fjp" value="${esc(w.jp)}"></div>
 <div class="field"><label>讀音</label><input id="fr" value="${esc(w.r)}"></div>
 <div class="field"><label>中文翻譯</label><input id="fm" value="${esc(w.m)}"></div>
 <div class="field"><label>例句</label><textarea id="fe">${esc(w.ej||"")}</textarea></div>
 <div class="field"><label>等級</label><input id="fl" list="levelList" value="${esc(w.level||"N5")}"><datalist id="levelList"><option value="N1"><option value="N2"><option value="N3"><option value="N4"><option value="N5"></datalist></div>
 <div class="field"><label>分類（可選既有分類，也可直接輸入新分類）</label><input id="fc" list="categoryList" value="${esc(w.category||"")}"><datalist id="categoryList">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
 <div class="row"><button id="cancel">取消</button><button class="primary" id="saveEdit">儲存</button></div>`);
 document.getElementById("cancel").onclick=closeModal;
 document.getElementById("saveEdit").onclick=()=>{
   const nw={...w,
     jp:document.getElementById("fjp").value.trim(),
     r:document.getElementById("fr").value.trim(),
     m:document.getElementById("fm").value.trim(),
     ej:document.getElementById("fe").value.trim(),
     level:document.getElementById("fl").value.trim().toUpperCase()||"N5",
     category:document.getElementById("fc").value.trim()
   };
   const i=user.findIndex(x=>x.id===w.id);
   if(i>=0) user[i]=nw; else user.push({...nw,id:"user-"+Date.now()});
   current=(i>=0?user[i]:user[user.length-1]);
   save(); refreshFilters(); closeModal(); render();
 };
}
function database(){
 const all=mergeData().sort((a,b)=>(a.category||"").localeCompare(b.category||"","zh-Hant")||a.jp.localeCompare(b.jp,"ja"));
 openModal(`<h3>資料庫</h3><div class="list" id="dbList"></div><div class="row"><button id="closeDb">關閉</button></div>`);
 const list=document.getElementById("dbList");
 all.forEach(w=>{
   const d=document.createElement("div");d.className="wordrow";
   const tag=w.category?` · ${esc(w.category)}`:"";
   d.innerHTML=`<div><b>${esc(w.jp)}</b><small>${esc(w.r)}　${esc(w.m)}　${esc(w.level||"")}${tag}</small></div><button>✎</button>`;
   d.querySelector("button").onclick=()=>editWord(w);
   list.appendChild(d);
 });
 document.getElementById("closeDb").onclick=closeModal;
}
function addWord(){
 editWord({id:"new-"+Date.now(),jp:"",r:"",m:"",ej:"",level:"N5",category:"",star:false});
}
async function loadBase(){
 loadStore();
 document.getElementById("status").textContent="";
 // Do not block the UI on the JSON request. The fallback is usable immediately.
 base=fallback.slice();
 refreshFilters(); render(); choose();
 try{
   const res=await fetch("./n5_words.json?ts="+Date.now(),{cache:"no-store"});
   if(!res.ok)throw new Error("HTTP "+res.status);
   const text=await res.text();
   let data;
   try{data=JSON.parse(text)}catch(e){
     // tolerate files accidentally wrapped as object/with trailing junk
     const start=text.indexOf("["); const end=text.lastIndexOf("]");
     if(start>=0&&end>start)data=JSON.parse(text.slice(start,end+1)); else throw e;
   }
   if(Array.isArray(data)){
     base=data.map(norm).filter(w=>w.jp);
     refreshFilters();
     document.getElementById("status").textContent="";
     choose();
   }
 }catch(e){
   document.getElementById("status").textContent="";
 }
}
document.getElementById("menuBtn").onclick=()=>document.getElementById("drawer").classList.add("open");
document.getElementById("drawer").onclick=e=>{if(e.target.id==="drawer")e.currentTarget.classList.remove("open")};
document.getElementById("quizMenu").onclick=()=>{document.getElementById("drawer").classList.remove("open");closeModal()};
document.getElementById("dbMenu").onclick=()=>{document.getElementById("drawer").classList.remove("open");database()};
document.getElementById("addMenu").onclick=()=>{document.getElementById("drawer").classList.remove("open");addWord()};
document.getElementById("backupMenu").onclick=()=>{
 const data={version:2,exportedAt:new Date().toISOString(),words:user,seen:seen};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="japanese_word_backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("restoreMenu").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);user=Array.isArray(x)?x:(Array.isArray(x.words)?x.words:[]);seen=x.seen||{};save();choose();alert("備份還原完成");}catch(err){alert("備份檔格式無法讀取");}};r.readAsText(f);e.target.value="";
};
document.getElementById("nextBtn").onclick=choose;
document.getElementById("resetBtn").onclick=()=>{seen={};save();choose()};
document.getElementById("filter").onchange=()=>choose();
document.getElementById("starBtn").onclick=()=>{
 if(!current)return;
 current.star=!current.star;
 const i=user.findIndex(x=>x.id===current.id);
 if(i>=0) user[i].star=current.star; else user.push({...current});
 save(); refreshFilters(); render(); // stay on the same card
};
document.getElementById("editBtn").onclick=()=>{if(current)editWord(current)}; // stay on the same card
document.getElementById("card").onclick=e=>{
 if(e.target.closest("button")) return;
 if(!current) return;
 flipped=!flipped; render();
};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
loadBase();
})();
</script>
</body>
</html>
