<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>日文 N5 1000 單字卡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans JP",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 60px}
h1{font-size:27px;margin:4px 0}.sub{color:#777;margin:0 0 16px}
.tabs,.row,.levels{display:flex;gap:8px;margin:10px 0}
button{border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:700}
.tab{flex:1;background:#e6e6eb}.active,.dark{background:#111;color:#fff}.light{background:#e7e7ec}
.panel,.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 7px 26px #0001;margin-bottom:14px}
.card{min-height:410px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.jp{font-size:44px;font-weight:800}.reading{font-size:19px;color:#777;margin:6px 0 20px}
.meaning{font-size:25px;font-weight:700;margin-bottom:20px}.ex{border-top:1px solid #eee;padding-top:17px;text-align:left}
.ej{font-size:19px;line-height:1.65}.ec{color:#666;line-height:1.65;margin-top:4px}
.hint{color:#999}.hidden{display:none}.row button,.levels button{flex:1}
.count,.msg,.small{color:#777;font-size:14px}.item{padding:12px 0;border-bottom:1px solid #eee;line-height:1.5}
.item b{font-size:18px}input,textarea{width:100%;border:1px solid #d8d8dc;border-radius:12px;padding:12px;font-size:16px}
textarea{min-height:70px}label{display:block;font-weight:700;margin:12px 0 6px}.wide{width:100%;margin-top:12px}
.note{background:#f7f2ff;padding:12px;border-radius:12px;color:#5d4a7a;font-size:14px;line-height:1.5}
#error{display:none;background:#fff0f0;color:#9b2226;border-radius:14px;padding:14px;margin:12px 0;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<h1>日文 N5 單字卡 🇯🇵</h1>
<p class="sub">1000 筆 N5 程度初學詞彙／表達</p>
<div id="error"></div>

<div class="tabs">
<button id="studyTab" class="tab active" onclick="showTab('study')">📖 背單字</button>
<button id="addTab" class="tab" onclick="showTab('add')">➕ 新增</button>
</div>

<section id="study">
<div class="count" id="count">正在載入單字…</div>
<div class="card" onclick="flip()">
<div class="jp" id="jp">載入中…</div>
<div class="reading" id="reading"></div>
<div id="answer" class="hidden">
<div class="meaning" id="meaning"></div>
<div class="ex"><div class="ej" id="ej"></div><div class="ec" id="ec"></div></div>
</div>
<div class="hint" id="hint">👆 點一下翻牌看答案</div>
</div>
<div class="row">
<button class="light" onclick="prev()">← 上一個</button>
<button class="dark" onclick="next()">下一個 →</button>
</div>
<div class="row">
<button class="light" onclick="shuffle()">🔀 隨機</button>
<button class="light" onclick="speak()">🔊 念讀音</button>
</div>
<div class="levels">
<button style="background:#ffe2e2" onclick="rate('不熟')">😵 不熟</button>
<button style="background:#fff0cf" onclick="rate('普通')">😐 普通</button>
<button style="background:#e0f5e7" onclick="rate('熟悉')">😊 熟悉</button>
</div>
</section>

<section id="add" class="hidden">
<div class="panel">
<label>日文</label><input id="newjp" placeholder="例如：猫">
<label>讀音／假名</label><input id="newr" placeholder="例如：ねこ">
<label>中文意思</label><input id="newm" placeholder="例如：貓">
<label>日文例句</label><textarea id="newej" placeholder="例如：猫がいます。"></textarea>
<label>中文例句</label><textarea id="newec" placeholder="例如：有一隻貓。"></textarea>
<button class="dark wide" onclick="addWord()">＋ 加入單字卡</button>
<div class="msg" id="msg"></div>
<div class="note">這個版本不需要 API、不需要付費。內建 1000 筆資料。資料會儲存在你的瀏覽器。</div>
</div>
<div class="panel"><b>📚 單字總數：<span id="total">0</span></b><div id="list"></div></div>
</section>
</div>

<script>
(function(){
"use strict";
var KEY="jpN5WordsStableV1", words=[], idx=0, flipped=false, ready=false;

function $(id){return document.getElementById(id)}
function error(msg){$("error").style.display="block";$("error").textContent="⚠️ "+msg}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}

function render(){
 if(!ready || !words.length)return;
 var w=words[idx];
 $("jp").textContent=w.jp||"";
 $("reading").textContent=w.r||"";
 $("meaning").textContent=w.m||"";
 $("ej").textContent=w.ej||"";
 $("ec").textContent=w.ec||"";
 $("count").textContent="第 "+(idx+1)+" / "+words.length+" 個"+(w.level?"｜ "+w.level:"");
 $("answer").classList.toggle("hidden",!flipped);
 $("hint").classList.toggle("hidden",flipped);
}

window.flip=function(){if(ready){flipped=!flipped;render()}};
window.next=function(){if(ready){idx=(idx+1)%words.length;flipped=false;render()}};
window.prev=function(){if(ready){idx=(idx-1+words.length)%words.length;flipped=false;render()}};
window.shuffle=function(){if(ready){idx=Math.floor(Math.random()*words.length);flipped=false;render()}};
window.speak=function(){
 if(!ready)return;
 var u=new SpeechSynthesisUtterance(words[idx].r||words[idx].jp);
 u.lang="ja-JP";u.rate=.85;
 if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(u)}
};
window.rate=function(x){if(ready){words[idx].level=x;save();window.next()}};

window.showTab=function(x){
 $("study").classList.toggle("hidden",x!=="study");
 $("add").classList.toggle("hidden",x!=="add");
 $("studyTab").classList.toggle("active",x==="study");
 $("addTab").classList.toggle("active",x==="add");
 if(x==="add")renderList();
};

window.addWord=function(){
 var v=function(id){return $(id).value.trim()};
 if(!v("newjp")||!v("newr")||!v("newm")){$("msg").textContent="請填寫日文、讀音、中文意思";return}
 words.push({jp:v("newjp"),r:v("newr"),m:v("newm"),ej:v("newej"),ec:v("newec"),level:""});
 save();idx=words.length-1;flipped=false;render();renderList();
 ["newjp","newr","newm","newej","newec"].forEach(function(id){$(id).value=""});
 $("msg").textContent="✅ 已加入單字卡！";
};

function renderList(){
 $("total").textContent=words.length;
 var arr=words.slice(-30).reverse();
 $("list").innerHTML=arr.map(function(w){
   return '<div class="item"><b>'+escapeHtml(w.jp)+'</b> <span class="small">'+escapeHtml(w.r)+'</span><br><span class="small">'+escapeHtml(w.m)+'</span></div>';
 }).join("");
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]});
}

function start(seed){
 try{
   var saved=null;
   try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
   if(Array.isArray(saved)&&saved.length>=1000)words=saved;
   else{words=seed.slice();save()}
   ready=true;idx=0;flipped=false;render();
 }catch(e){error("單字資料載入失敗："+e.message)}
}

fetch("n5_words.json",{cache:"no-store"})
.then(function(r){
 if(!r.ok)throw new Error("找不到 n5_words.json（請確認兩個檔案都有上傳到 GitHub）");
 return r.json();
})
.then(start)
.catch(function(e){error(e.message);$("jp").textContent="無法載入";$("count").textContent="請確認 index.html 與 n5_words.json 在同一個資料夾。"});
})();
</script>
</body>
</html>
