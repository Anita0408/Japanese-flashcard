<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日文單字庫</title>
<style>
:root{--bg:#0d0f12;--panel:#1b1e23;--panel2:#22262c;--line:#343a43;--text:#f4f5f7;--muted:#a9afb9;--accent:#f2f4f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.app{max-width:760px;margin:auto;padding:32px 18px 48px}
header{display:flex;align-items:center;gap:18px;margin:18px 0 28px}
h1{font-size:40px;margin:0;font-weight:800;letter-spacing:.02em}
.iconbtn,.star,.edit,.reset{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;display:grid;place-items:center;cursor:pointer}
.iconbtn{width:62px;height:62px;font-size:32px}.reset{width:58px;height:58px;font-size:27px}
select{width:100%;height:58px;border-radius:30px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:22px;padding:0 18px;margin-bottom:26px}
.card{min-height:560px;background:var(--panel);border:1px solid #3b414b;border-radius:42px;padding:30px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.edit,.star{position:absolute;width:58px;height:58px;font-size:27px;top:28px}.edit{left:28px}.star{right:28px}.star.on{color:#fff}
.jp{font-size:56px;font-weight:800;line-height:1.2;margin:20px 0 10px}.reading{font-size:25px;color:var(--muted);margin-bottom:18px}.meaning{font-size:27px;color:#c3c8d0;margin-bottom:30px}.example{font-size:22px;line-height:1.6;color:#f2f3f5;max-width:90%}
.actions{display:flex;gap:16px;margin-top:24px}.next{height:68px;flex:1;border:0;border-radius:34px;background:#f0f1f2;color:#101216;font-size:25px;font-weight:800;cursor:pointer}
.empty{font-size:28px;color:var(--muted)}
.drawer{position:fixed;inset:0;display:none;background:rgba(0,0,0,.62);z-index:10}.drawer.open{display:block}.menu{width:min(330px,85vw);height:100%;background:#15181c;padding:28px 20px;box-shadow:8px 0 30px #000}
.menu h2{margin:5px 0 30px;font-size:27px}.item{width:100%;text-align:left;background:#20242a;color:var(--text);border:1px solid var(--line);padding:17px;border-radius:16px;margin:10px 0;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.open{display:flex}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#191c21;border:1px solid var(--line);border-radius:24px;padding:24px}
.box h3{margin-top:0;font-size:25px}.field{margin:12px 0}.field label{display:block;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;background:#0f1114;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:17px}.field textarea{min-height:90px}.row{display:flex;gap:10px;margin-top:18px}.row button{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);background:#272b31;color:var(--text);font-size:17px}.row .primary{background:#f0f1f2;color:#101216;border:0}.list{display:grid;gap:10px}.wordrow{background:#22262c;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between}.wordrow small{color:var(--muted);display:block;margin-top:3px}.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
@media(max-width:600px){.app{padding-top:18px}h1{font-size:34px}.card{min-height:500px}.jp{font-size:46px}.meaning{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header><button class="iconbtn" id="menuBtn">☰</button><h1>日文單字庫</h1></header>
<select id="filter"><option value="ALL">全部單字</option><option value="N1">N1</option><option value="N2">N2</option><option value="N3">N3</option><option value="N4">N4</option><option value="N5">N5</option><option value="STAR">⭐ 打星號的單字</option></select>
<div class="card" id="card">
<button class="edit" id="editBtn" title="編輯">✎</button><button class="star" id="starBtn" title="星號">☆</button>
<div id="wordArea"><div class="empty">載入中…</div></div>
</div>
<div class="actions"><button class="next" id="nextBtn">下一題</button><button class="reset" id="resetBtn" title="重置">↻</button></div>
<div class="status" id="status"></div>
</div>

<div class="drawer" id="drawer"><div class="menu">
<h2>選單</h2>
<button class="item" id="quizMenu">單字測驗</button>
<button class="item" id="dbMenu">資料庫</button>
<button class="item" id="addMenu">新增我的單字</button>
<button class="item" id="backupMenu">備份資料</button>
<button class="item" id="restoreMenu">還原備份</button>
<input id="restoreFile" type="file" accept=".json,application/json" hidden>
</div></div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
(function(){
"use strict";
const KEY="jp_vocab_user_v2";
const VIEW="jp_vocab_seen_v2";
let base=[], user=[], seen={}, current=null, currentPool=[];
const fallback=[
["赤","あか","紅色","これは「赤」です。","這是「紅色」。"],
["青","あお","藍色","これは「青」です。","這是「藍色」。"],
["白","しろ","白色","これは「白」です。","這是「白色」。"],
["黒","くろ","黑色","これは「黒」です。","這是「黑色」。"],
["学生","がくせい","學生","これは「学生」です。","這是「學生」。"],
["先生","せんせい","老師","これは「先生」です。","這是「老師」。"],
["学校","がっこう","學校","これは「学校」です。","這是「學校」。"],
["日本","にほん","日本","これは「日本」です。","這是「日本」。"],
["今日","きょう","今天","これは「今日」です。","這是「今天」。"],
["明日","あした","明天","これは「明日」です。","這是「明天」。"]
].map((x,i)=>({id:"fallback-"+i,jp:x[0],r:x[1],m:x[2],ej:x[3],ec:x[4],level:"N5",star:false}));

function loadStore(){
 try{user=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(user))user=[]}catch(e){user=[]}
 try{seen=JSON.parse(localStorage.getItem(VIEW)||"{}");if(!seen||typeof seen!=="object")seen={}}catch(e){seen={}}
}
function save(){localStorage.setItem(KEY,JSON.stringify(user));localStorage.setItem(VIEW,JSON.stringify(seen))}
function norm(w,i){return {id:w.id||("base-"+i),jp:String(w.jp||w.word||"").replace(/（N[1-5]）$/,"").replace(/\(N[1-5]\)$/,""),r:w.r||w.reading||"",m:w.m||w.meaning||"",ej:w.ej||w.example||"",ec:w.ec||"",level:(w.level||"N5").toUpperCase(),star:!!w.star,category:w.category||""}}
function mergeData(){
 const map=new Map();
 base.forEach(w=>map.set(w.jp+"|"+w.r,w));
 user.forEach(w=>map.set(w.jp+"|"+w.r,w));
 return [...map.values()];
}
function pool(){
 const f=document.getElementById("filter").value;
 let a=mergeData().filter(w=>f==="ALL"?true:f==="STAR"?w.star:w.level===f);
 return a;
}
function choose(){
 currentPool=pool();
 if(!currentPool.length){current=null;render();return}
 const unseen=currentPool.filter(w=>!seen[w.id]);
 const starred=currentPool.filter(w=>w.star&&!seen[w.id]);
 const candidates=starred.length?starred:(unseen.length?unseen:currentPool.filter(w=>w.star).length?currentPool.filter(w=>w.star):currentPool);
 current=candidates[Math.floor(Math.random()*candidates.length)];
 seen[current.id]=new Date().toISOString().slice(0,10); save(); render();
}
function render(){
 const area=document.getElementById("wordArea"), star=document.getElementById("starBtn"), status=document.getElementById("status");
 if(!current){area.innerHTML='<div class="empty">沒有符合條件的單字</div>';star.textContent="☆";status.textContent="";return}
 area.innerHTML='<div class="jp">'+esc(current.jp)+'</div><div class="reading">'+esc(current.r)+'</div><div class="meaning">'+esc(current.m)+'</div><div class="example">'+esc(current.ej||current.ec||"")+'</div>';
 star.textContent=current.star?"★":"☆"; star.classList.toggle("on",current.star);
 status.textContent=(current.level||"")+" · "+currentPool.length+" 個單字";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function editWord(w){
 openModal(`<h3>編輯單字</h3>
 <div class="field"><label>日文</label><input id="fjp" value="${esc(w.jp)}"></div>
 <div class="field"><label>讀音</label><input id="fr" value="${esc(w.r)}"></div>
 <div class="field"><label>中文翻譯</label><input id="fm" value="${esc(w.m)}"></div>
 <div class="field"><label>例句</label><textarea id="fe">${esc(w.ej||"")}</textarea></div>
 <div class="field"><label>等級 / 分類</label><input id="fl" value="${esc(w.level||"N5")}"></div>
 <div class="row"><button id="cancel">取消</button><button class="primary" id="saveEdit">儲存</button></div>`);
 document.getElementById("cancel").onclick=closeModal;
 document.getElementById("saveEdit").onclick=()=>{
   const nw={...w,jp:document.getElementById("fjp").value.trim(),r:document.getElementById("fr").value.trim(),m:document.getElementById("fm").value.trim(),ej:document.getElementById("fe").value.trim(),level:document.getElementById("fl").value.trim().toUpperCase()||"N5"};
   const i=user.findIndex(x=>x.id===w.id);
   if(i>=0)user[i]=nw; else user.push({...nw,id:"user-"+Date.now()});
   current=(i>=0?user[i]:user[user.length-1]);save();closeModal();render();
 };
}
function database(){
 const all=mergeData();
 openModal(`<h3>資料庫</h3><div class="list" id="dbList"></div><div class="row"><button id="closeDb">關閉</button></div>`);
 const list=document.getElementById("dbList");
 all.forEach(w=>{const d=document.createElement("div");d.className="wordrow";d.innerHTML=`<div><b>${esc(w.jp)}</b><small>${esc(w.r)}　${esc(w.m)}　${esc(w.level||"")}</small></div><button>✎</button>`;d.querySelector("button").onclick=()=>editWord(w);list.appendChild(d)});
 document.getElementById("closeDb").onclick=closeModal;
}
function addWord(){
 editWord({id:"new-"+Date.now(),jp:"",r:"",m:"",ej:"",level:"N5",star:false});
}
async function loadBase(){
 loadStore();
 document.getElementById("status").textContent="正在讀取單字庫…";
 // Do not block the UI on the JSON request. The fallback is usable immediately.
 base=fallback.slice();
 render(); choose();
 try{
   const res=await fetch("./n5_words.json?ts="+Date.now(),{cache:"no-store"});
   if(!res.ok)throw new Error("HTTP "+res.status);
   const text=await res.text();
   let data;
   try{data=JSON.parse(text)}catch(e){
     // tolerate files accidentally wrapped as object/with trailing junk
     const start=text.indexOf("["); const end=text.lastIndexOf("]");
     if(start>=0&&end>start)data=JSON.parse(text.slice(start,end+1)); else throw e;
   }
   if(Array.isArray(data)){
     base=data.map(norm).filter(w=>w.jp);
     document.getElementById("status").textContent="單字庫已載入";
     choose();
   }
 }catch(e){
   document.getElementById("status").textContent="已使用內建單字；若 GitHub 的 n5_words.json 可讀取會自動載入完整資料";
 }
}
document.getElementById("menuBtn").onclick=()=>document.getElementById("drawer").classList.add("open");
document.getElementById("drawer").onclick=e=>{if(e.target.id==="drawer")e.currentTarget.classList.remove("open")};
document.getElementById("quizMenu").onclick=()=>{document.getElementById("drawer").classList.remove("open");closeModal()};
document.getElementById("dbMenu").onclick=()=>{document.getElementById("drawer").classList.remove("open");database()};
document.getElementById("addMenu").onclick=()=>{document.getElementById("drawer").classList.remove("open");addWord()};
document.getElementById("backupMenu").onclick=()=>{
 const data={version:2,exportedAt:new Date().toISOString(),words:user,seen:seen};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="japanese_word_backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("restoreMenu").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);user=Array.isArray(x)?x:(Array.isArray(x.words)?x.words:[]);seen=x.seen||{};save();choose();alert("備份還原完成");}catch(err){alert("備份檔格式無法讀取");}};r.readAsText(f);e.target.value="";
};
document.getElementById("nextBtn").onclick=choose;
document.getElementById("resetBtn").onclick=()=>{seen={};save();choose()};
document.getElementById("filter").onchange=()=>choose();
document.getElementById("starBtn").onclick=()=>{if(!current)return;current.star=!current.star;const i=user.findIndex(x=>x.id===current.id);if(i>=0)user[i].star=current.star;else user.push({...current});save();render()};
document.getElementById("editBtn").onclick=()=>{if(current)editWord(current)};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
loadBase();
})();
</script>
</body>
</html>
